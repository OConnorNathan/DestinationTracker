<!DOCTYPE html>
<html>
<head>
    <title>Destination Tracker</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div id="map"></div>

    <div class="controls">
        <input type="text" id="cityInput" placeholder="City name...">
        <div id="cityError" style="color:#ff6b6b;font-size:12px;display:none;"></div>
        <select id="locationType">
            <option value="visited">Visited</option>
            <option value="wishlist">Wishlist</option>
        </select>
        <button id="exportBtn">Export Map</button>
    </div>

    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three-globe"></script>
    <script src="/models/location.js"></script>
    <script src="/api/services/cartographer.js"></script>
    <script src="/api/services/collector.js"></script>
    <script src="/api/controllers/controller.js"></script>
    <script src="/static/js/map.js"></script>
</body>
</html>
